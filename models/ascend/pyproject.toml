[build-system]
requires = ["uv_build>=0.9.2,<0.10"]
build-backend = "uv_build"

[project]
name = "resin-models-ascend"
version = "0.1.0"
description = "Ascend NPU model runners for Resin"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
  "resin==0.1.0",
  "safetensors>=0.5",
  "transformers>=5.14.1",
]

[project.scripts]
resin-ascend-serve = "resin_models_ascend.serve:main"

[tool.uv.sources]
resin = { workspace = true }

[tool.uv.build-backend]
module-root = ""
